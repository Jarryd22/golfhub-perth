name: Test desktop search controls

on:
  pull_request:
    paths:
      - ".github/workflows/test-desktop.yml"
      - "app/**"
      - "data/courses.json"
      - "requirements.txt"
      - "tests/test_booking_context.py"
      - "tests/test_course_controls.py"
      - "tests/test_calendar_keyboard.py"
      - "tests/test_multiday_ui.py"
      - "tests/test_multiday_cache_states.py"
      - "tests/test_perth_dates.py"
      - "tests/test_midnight_rollover.py"
      - "tests/test_time_range_ui.py"
      - "tests/test_search_race.py"
      - "tests/test_thread_lifecycle.py"
      - "tests/qt_test_support.py"
  push:
    branches: [main, "fix/desktop-*"]
    paths:
      - ".github/workflows/test-desktop.yml"
      - "app/**"
      - "data/courses.json"
      - "requirements.txt"
      - "tests/test_booking_context.py"
      - "tests/test_course_controls.py"
      - "tests/test_calendar_keyboard.py"
      - "tests/test_multiday_ui.py"
      - "tests/test_multiday_cache_states.py"
      - "tests/test_perth_dates.py"
      - "tests/test_midnight_rollover.py"
      - "tests/test_time_range_ui.py"
      - "tests/test_search_race.py"
      - "tests/test_thread_lifecycle.py"
      - "tests/qt_test_support.py"

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline Qt input and search regressions in isolated processes
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}/golfhub-desktop-tests
        run: |
          $modules = @(
            "test_booking_context.py",
            "test_course_controls.py",
            "test_calendar_keyboard.py",
            "test_multiday_ui.py",
            "test_multiday_cache_states.py",
            "test_perth_dates.py",
            "test_midnight_rollover.py",
            "test_time_range_ui.py",
            "test_search_race.py",
            "test_thread_lifecycle.py"
          )
          foreach ($module in $modules) {
            python -m unittest discover -s tests -p $module -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
